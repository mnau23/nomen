[tasks.format]
description = "Check code formatting across the whole workspace"
args = ["fmt", "--all", "--check"]

[tasks.build]
description = "Build the project in debug mode"
args = ["build"]

[tasks.lint]
description = "Run code linter"
command = "cargo"
args = ["clippy"]

[tasks.test]
description = "Run all tests"
args = ["test"]

