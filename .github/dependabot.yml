# https://docs.github.com/code-security/dependabot/dependabot-version-updates/configuration-options-for-the-dependabot.yml-file
---
version: 2
updates:
  - package-ecosystem: "cargo"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 14
    labels:
      - bot
      - rust
      - dependencies
    commit-message:
      prefix: "build"
      include: "scope"
      #    open-pull-requests-limit: 1
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-patch"]

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "monthly"
    cooldown:
      default-days: 14
    labels:
      - bot
      - github_actions
      - dependencies
    commit-message:
      prefix: ci
      include: scope
    #    open-pull-requests-limit: 1
    ignore: # allow only major updates
      - dependency-name: "*"
        update-types: [
          "version-update:semver-minor",
          "version-update:semver-patch",
        ]
