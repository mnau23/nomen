name: CI

on: push

env:
  CARGO_TERM_COLOR: always

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
    steps:
      - name: Checkout repository
      - uses: actions/checkout@v2
      - name: Check project
        run: cargo check-clippy
      - name: Build project
        run: cargo build --verbose
      - name: Run tests
        run: cargo test --verbose
