[package]
name = "nomen"
version = "0.1.0"
authors = ["mnau23"]
edition = "2024"
rust-version = "1.85.0"
description = "Nomen CLI"
readme = "README.md"
repository = "https://github.com/mnau23/nomen"
license = "GPL-3"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
path = "src/lib/mod.rs"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive", "env"] }
env_logger = "0.11"
ffmpeg-next = "8.0.0"
kamadak-exif = "0.6.1"
log = "0.4"

[dev-dependencies]
test-case = "3.3"

[lints.clippy]
all = "warn"
pedantic = "warn"
nursery = "warn"
cargo = "warn"
