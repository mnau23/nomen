[package]
name = "nomen"
version = "0.1.0"
edition = "2024"
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive", "env"] }
env_logger = "0.11"
ffmpeg-next = "7.1.0"
kamadak-exif = "0.6.1"
log = "0.4"

[dev-dependencies]
test-case = "3.3"

[lib]
path = "src/lib/mod.rs"

[lints.clippy]
all = "warn"
pedantic = "warn"
