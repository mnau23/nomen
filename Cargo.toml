[package]
name = "nomen"
version = "0.1.0"
authors = ["mnau23"]
edition = "2024"
rust-version = "1.85.0"
description = "A CLI tool for renaming files based on their metadata"
readme = "README.md"
repository = "https://github.com/mnau23/nomen"
license = "GPL-3"
keywords = ["cli", "rename", "files"]
categories = [
    "command-line-utilities",
    "filesystem",
    "multimedia::images",
    "multimedia::video",
]
# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
path = "src/lib/mod.rs"

[dependencies]
anyhow = "1.0"
chrono = "0.4"
clap = { version = "4.5", features = ["derive", "env"] }
env_logger = "0.11"
ffmpeg-next = "9.0.0"
infer = "0.22.0"
kamadak-exif = "0.6.1"
log = "0.4"

[dev-dependencies]
test-case = "3.3"

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
nursery = { level = "warn", priority = -1 }
cargo = { level = "warn", priority = -1 }
multiple_crate_versions = "allow"
