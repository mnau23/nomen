repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-toml
      - id: check-yaml
      - id: end-of-file-fixer
      - id: trailing-whitespace

  # archived - but still works
  # excluded from autoupdate
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v4.0.0-alpha.8
    hooks:
      - id: prettier
        types: [markdown]

  # excluded from autoupdate
  - repo: https://github.com/crate-ci/typos
    rev: v1.44.0
    hooks:
      - id: typos

  - repo: local
    hooks:
      - id: rust-fmt
        name: check rust fmt
        entry: cargo fmt -- --check
        language: system
        pass_filenames: false
        types: [rust]
